<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A/B room — variants A (raster) and R (path-traced reference)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font: 11px/1.6 monospace; color: #ccc; }
  canvas { display: block; }
  #hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 6px 10px; border-radius: 4px; }
</style>
</head>
<body>
<div id="hud">loading…</div>

<script type="importmap">
{
  "imports": {
    "three":                "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/":        "https://unpkg.com/three@0.187.0/examples/jsm/",
    "three/examples/jsm/":  "https://unpkg.com/three@0.187.0/examples/jsm/",
    "three-mesh-bvh":       "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js",
    "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.27/build/index.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three'
import { WebGLPathTracer } from 'three-gpu-pathtracer'
import { createCameraPath, samplePath } from '../../tools/ab-test/src/camera-path.js'

const VARIANTS = ['A', 'R']
const DEFAULT_POSES = 4
const DEFAULT_REF_SAMPLES = 256
const WARMUP_FRAMES = 3
const TIMED_FRAMES = 30
const MAX_POSES = 64
const FOV_DEG = 60
const NEAR = 0.1
const FAR = 100
const SKY_SIZE = 64
const SHADOW_MAP_SIZE = 2048
const MAX_COMPILE_FRAMES = 20000
const MAX_ITERATION_FACTOR = 4

const params = new URLSearchParams(location.search)
const variant = params.get('variant') ?? 'A'
const poseCount = Number.parseInt(params.get('poses') ?? String(DEFAULT_POSES), 10)
const refSamples = Number.parseInt(params.get('samples') ?? String(DEFAULT_REF_SAMPLES), 10)
if (!VARIANTS.includes(variant)) throw new RangeError(`variant must be one of ${VARIANTS.join(', ')}`)
if (!Number.isInteger(poseCount) || poseCount < 2 || poseCount > MAX_POSES) throw new RangeError('poses must be an integer in [2, 64]')
if (!Number.isInteger(refSamples) || refSamples < 1) throw new RangeError('samples must be a positive integer')

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(innerWidth, innerHeight)
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.shadowMap.enabled = variant === 'A'
renderer.shadowMap.type = THREE.PCFSoftShadowMap
document.body.appendChild(renderer.domElement)

function makeSkyTexture() {
  const data = new Float32Array(SKY_SIZE * SKY_SIZE * 4)
  for (let y = 0; y < SKY_SIZE; y++) {
    const t = y / (SKY_SIZE - 1)
    for (let x = 0; x < SKY_SIZE; x++) {
      const i = (y * SKY_SIZE + x) * 4
      data[i] = 0.9 - 0.5 * t
      data[i + 1] = 1.2 - 0.5 * t
      data[i + 2] = 1.8 - 0.4 * t
      data[i + 3] = 1
    }
  }
  const tex = new THREE.DataTexture(data, SKY_SIZE, SKY_SIZE, THREE.RGBAFormat, THREE.FloatType)
  tex.mapping = THREE.EquirectangularReflectionMapping
  tex.magFilter = tex.minFilter = THREE.LinearFilter
  tex.needsUpdate = true
  return tex
}

function box(w, h, d, x, y, z, color) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.85 }))
  mesh.position.set(x, y, z)
  mesh.castShadow = mesh.receiveShadow = true
  return mesh
}

function buildScene() {
  const scene = new THREE.Scene()
  const sky = makeSkyTexture()
  scene.background = sky
  scene.environment = sky
  scene.environmentIntensity = Number.parseFloat(params.get('env') ?? '0.4')

  const room = new THREE.Group()
  room.add(box(6, 0.2, 6, 0, -0.1, 0, 0xcfc8bc))
  room.add(box(6, 0.2, 6, 0, 3.1, 0, 0xf2f0ea))
  room.add(box(0.2, 3, 6, -3.1, 1.5, 0, 0xb0603c))
  room.add(box(0.2, 3, 6, 3.1, 1.5, 0, 0x4a6fa5))
  room.add(box(6, 3, 0.2, 0, 1.5, -3.1, 0xe6e2da))
  room.add(box(2.1, 3, 0.2, -1.95, 1.5, 3.1, 0xe6e2da))
  room.add(box(2.1, 3, 0.2, 1.95, 1.5, 3.1, 0xe6e2da))
  room.add(box(1.8, 1.0, 0.2, 0, 0.5, 3.1, 0xe6e2da))
  room.add(box(1.8, 0.9, 0.2, 0, 2.55, 3.1, 0xe6e2da))
  room.add(box(1.2, 0.5, 1.2, -1, 0.25, -0.5, 0x808080))
  room.add(box(0.8, 1.2, 0.8, 1.4, 0.6, -1.5, 0xd8c05a))
  scene.add(room)

  const sun = new THREE.DirectionalLight(0xfff1dd, 4)
  sun.position.set(2.5, 6, 12)
  sun.target.position.set(0, 0, 0)
  sun.castShadow = true
  sun.shadow.mapSize.set(SHADOW_MAP_SIZE, SHADOW_MAP_SIZE)
  sun.shadow.camera.left = sun.shadow.camera.bottom = -8
  sun.shadow.camera.right = sun.shadow.camera.top = 8
  sun.shadow.camera.far = 30
  scene.add(sun, sun.target)
  return scene
}

const POSES = samplePath(createCameraPath([
  { position: [0, 1.6, -2.4], target: [0, 1.3, 3] },
  { position: [-2, 1.6, -1], target: [1.5, 1.0, 1] },
  { position: [2, 1.8, 1.5], target: [-2, 1.0, -2] }
]), poseCount)

const scene = buildScene()
const camera = new THREE.PerspectiveCamera(FOV_DEG, innerWidth / innerHeight, NEAR, FAR)
const hud = document.getElementById('hud')
const state = { ready: false, frameTimes: [], renderPose: null, variant, poses: poseCount }
window.__ab = state

function applyPose(index) {
  const pose = POSES[index]
  camera.position.set(...pose.position)
  camera.lookAt(...pose.target)
  camera.updateMatrixWorld()
}

const syncPixel = new Uint8Array(4)
function gpuSync() {
  const gl = renderer.getContext()
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, syncPixel)
}

async function renderPoseRaster(index) {
  applyPose(index)
  for (let i = 0; i < WARMUP_FRAMES; i++) renderer.render(scene, camera)
  gpuSync()
  for (let i = 0; i < TIMED_FRAMES; i++) {
    const t0 = performance.now()
    renderer.render(scene, camera)
    gpuSync()
    state.frameTimes.push(performance.now() - t0)
  }
}

let tracer = null
const nextFrame = () => new Promise((resolve) => requestAnimationFrame(resolve))

async function renderPoseReference(index) {
  applyPose(index)
  tracer.setCamera(camera)
  const maxIterations = refSamples * MAX_ITERATION_FACTOR + MAX_COMPILE_FRAMES
  for (let i = 0; i < maxIterations && tracer.samples < refSamples; i++) {
    const before = tracer.samples
    const t0 = performance.now()
    tracer.renderSample()
    gpuSync()
    if (tracer.samples > before) state.frameTimes.push(performance.now() - t0)
    if (tracer.isCompiling) await nextFrame()
  }
  state.samples = tracer.samples
  if (tracer.samples < refSamples) throw new Error(`pose ${index} reached only ${tracer.samples} of ${refSamples} samples`)
}

async function init() {
  if (variant === 'R') {
    tracer = new WebGLPathTracer(renderer)
    tracer.physicallyCorrectLights = true
    tracer.tiles.set(1, 1)
    tracer.renderDelay = 0
    tracer.minSamples = 0
    tracer.fadeDuration = 0
    tracer.rasterizeScene = false
    scene.updateMatrixWorld(true)
    tracer.setScene(scene, camera)
    state.renderPose = renderPoseReference
    window.__tracer = tracer
  } else {
    state.renderPose = renderPoseRaster
  }
  hud.style.display = 'none'
  state.ready = true
}

init().catch((err) => { hud.textContent = `error: ${err.message}`; state.error = err.message })
</script>
</body>
</html>
