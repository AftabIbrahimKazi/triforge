<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ImageTexture cubic interpolation — @st-shader-core</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d0d; overflow: hidden; font: 11px/1.6 monospace; color: #ccc; }
  canvas { display: block; }
  #info {
    position: absolute; top: 12px; left: 12px;
    background: rgba(0,0,0,0.65); padding: 8px 14px; border-radius: 4px;
  }
</style>
</head>
<body>
<div id="info">
  ImageTexture <code>interpolation</code> — @st-shader-core<br>
  Left: linear (bilinear diamonds when magnified) &nbsp;|&nbsp; Right: cubic (smooth B-spline)<br>
  Both nodes share one <code>uniformName</code> in the middle plane (declared once).
</div>
<script type="importmap">
{
  "imports": {
    "three":           "https://unpkg.com/three@0.187.0/build/three.module.js",
    "@st-shader-core": "../../st-shader-core/dist/index.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three'
import { ImageTexture, Emission, AddShader, MaterialOutput } from '@st-shader-core'

const TEXTURE_SIZE = 8
const PLANE_GAP    = 2.4

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(innerWidth, innerHeight)
renderer.setPixelRatio(devicePixelRatio)
document.body.appendChild(renderer.domElement)

const scene  = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 50)
camera.position.set(0, 0, 5)

// A tiny 8x8 texture, magnified far past its resolution.
const data = new Uint8Array(TEXTURE_SIZE * TEXTURE_SIZE * 4)
for (let y = 0; y < TEXTURE_SIZE; y++) {
  for (let x = 0; x < TEXTURE_SIZE; x++) {
    const i = (y * TEXTURE_SIZE + x) * 4
    const lit = (x + y) % 2 === 0
    data[i]     = lit ? 255 : 40
    data[i + 1] = Math.round((x / (TEXTURE_SIZE - 1)) * 255)
    data[i + 2] = Math.round((y / (TEXTURE_SIZE - 1)) * 255)
    data[i + 3] = 255
  }
}
const texture = new THREE.DataTexture(data, TEXTURE_SIZE, TEXTURE_SIZE, THREE.RGBAFormat)
texture.magFilter = THREE.LinearFilter
texture.needsUpdate = true

function buildPlane(surface, x) {
  const mat = new MaterialOutput({ surface }).compile()
  mat.uniforms.uMap = { value: texture }
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat)
  mesh.position.x = x
  scene.add(mesh)
}

const linear = new ImageTexture({ uniformName: 'uMap' })
const cubic  = new ImageTexture({ uniformName: 'uMap', interpolation: 'cubic', textureSize: [TEXTURE_SIZE, TEXTURE_SIZE] })

buildPlane(new Emission({ color: linear.output('Color') }).output('BSDF'), -PLANE_GAP)
buildPlane(new AddShader({
  shader1: new Emission({ color: linear.output('Color'), strength: 0.5 }).output('BSDF'),
  shader2: new Emission({ color: cubic.output('Color'),  strength: 0.5 }).output('BSDF'),
}).output('BSDF'), 0)
buildPlane(new Emission({ color: cubic.output('Color') }).output('BSDF'), PLANE_GAP)

renderer.render(scene, camera)
window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight)
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.render(scene, camera)
})
</script>
</body>
</html>
